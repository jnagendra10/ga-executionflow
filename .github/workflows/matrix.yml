name: Matrix Workflow
# on:
#   push:
#     branches:
#       - master
      # Or use workflow_dispatch for manual triggers
on:
  workflow_dispatch:
jobs:
  build:
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false  # Run all matrix combinations
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [12, 16, 18]
        include:
        #   - node-version: 19
        #     os: ubuntu-latest
        # exclude:
        #   - node-version: 12
        #     os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build